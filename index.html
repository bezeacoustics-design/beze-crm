<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEZE CRM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15171a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.50.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  html,body{height:100%;margin:0;}
  :root{
    --sidebar:#15171a; --sidebar-hover:#232629; --sidebar-active:#0f3129;
    --topbar:#1c1f22;
    --bg:#f4f4f1; --card:#ffffff; --line:#e3e1d8; --line-strong:#d1cfc2;
    --text:#212019; --text2:#68675e; --text3:#98978a;
    --accent:#1f8f72; --accent-dark:#0d4a3c; --accent-bg:#e2f3ee;
    --warm:#d98e4c; --warm-bg:#fbf0e2; --warm-text:#9c5c17;
    --blue:#3576c9; --blue-bg:#e5eefa;
    --pink:#c94f8f; --pink-bg:#fbe6f1;
    --red:#c0453f; --red-bg:#fbe8e6;
    --green:#3f8f3f; --green-bg:#e7f4e3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);}
  body,input,select,textarea,button{font-family:'IBM Plex Sans',Arial,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .navitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;font-size:13.5px;color:#adaba0;cursor:pointer;}
  .navitem:hover{background:var(--sidebar-hover);color:#fff;}
  .navitem.active{background:var(--sidebar-active);color:#7fd9bd;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:0 1px 2px rgba(20,20,15,0.04);}
  .tile-apasat{transition:border-color .15s,box-shadow .15s;}
  .tile-apasat:hover,.tile-apasat:focus-visible{border-color:var(--accent);box-shadow:0 2px 8px rgba(20,20,15,0.08);outline:none;}
  .btn{border:1px solid var(--line-strong);background:#fff;color:var(--text2);padding:9px 16px;border-radius:9px;font-size:13px;cursor:pointer;}
  .btn:hover{background:#faf9f6;}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:500;cursor:pointer;}
  .pill{font-size:12px;padding:4px 11px;border-radius:14px;font-weight:500;white-space:nowrap;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text3);font-weight:500;padding:18px 14px 14px;border-bottom:1px solid var(--line);}
  td{padding:15px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--text);}
  tr.rowhover:hover{background:#faf9f6;cursor:pointer;}
  select.filt{background:#fff;border:1px solid var(--line-strong);color:var(--text2);padding:8px 12px;border-radius:8px;font-size:12.5px;outline:none;}
  .dashcard{border-radius:16px;}
  .dashcard::-webkit-resizer{background: linear-gradient(135deg, transparent 0 40%, var(--line-strong) 40% 50%, transparent 50% 60%, var(--line-strong) 60% 70%, transparent 70% 80%, var(--line-strong) 80% 90%, transparent 90%);}
  .calday:hover{border-color:var(--accent) !important;}
  .cardhead{font-size:14px;font-weight:500;color:#33475b;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .pagetitle{font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;color:var(--text);letter-spacing:0.01em;}
  .pagesub{font-size:13px;color:var(--text3);margin-top:4px;}
  #modal{min-width:0;}
  @media print{
    body,html{background:#fff !important;height:auto !important;}
    .topbar-bar,.sidebar,#connStatus,#modalWrap,.no-print,#loginScreen{display:none !important;}
    #appShell,.app-row{display:block !important;height:auto !important;overflow:visible !important;}
    .content-area{padding:0 !important;overflow:visible !important;background:#fff !important;}
    .card{box-shadow:none !important;break-inside:avoid;page-break-inside:avoid;}
    .ghidcard{break-inside:auto;page-break-inside:auto;}
    @page{margin:14mm 12mm;}
  }
  #modal select, #modal input, #modal textarea{max-width:100%;min-width:0;}
  #connStatus{position:fixed;bottom:14px;right:14px;font-size:11px;padding:6px 12px;border-radius:20px;background:#fff;border:1px solid var(--line-strong);color:var(--text3);z-index:100;}

  @media (max-width: 780px){
    /* topbar: compact, no logout label, smaller search */
    .topbar-bar{padding:10px 12px !important;gap:10px !important;}
    .topbar-bar input#topSearch{max-width:none !important;font-size:12px !important;padding:8px 10px !important;}
    .header-icon{display:none !important;}
    .user-email-label{display:none !important;}

    /* app row becomes a column; sidebar turns into a fixed bottom tab bar */
    .app-row{flex-direction:column !important;}
    .content-area{padding:16px 12px 76px !important;order:1;}
    .sidebar{
      order:2; width:100% !important; height:auto !important; flex-direction:row !important;
      position:fixed; left:0; right:0; bottom:0; z-index:60;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom)) !important;
      border-top:1px solid #2a2e31; overflow-x:auto !important; overflow-y:hidden !important;
    }
    .sidebar-footnote{display:none !important;}
    #nav{flex-direction:row !important; gap:2px !important; width:100%;}
    #nav .navitem{
      flex-direction:column !important; flex:1; align-items:center; justify-content:center;
      gap:2px !important; padding:6px 2px !important; font-size:9.5px !important; text-align:center;
      border-radius:8px !important; white-space:nowrap;
    }
    #nav .navitem i{font-size:18px !important;}

    /* dashboard cards: full width, no manual resize (touch-unfriendly), keep charts fluid */
    .dashcard{width:100% !important; max-width:100% !important; resize:none !important; height:auto !important; min-height:180px !important;}
    #dashCards{gap:12px !important;}

    /* deals kanban: horizontal scroll of narrower columns instead of 5 squeezed ones */
    .dealsboard{grid-template-columns:repeat(5, minmax(200px, 1fr)) !important; overflow-x:auto; padding-bottom:8px;}

    /* tables: tighter cells, allow horizontal scroll (wrapper already has overflow-x:auto) */
    th{padding:12px 8px 10px !important; font-size:10.5px !important;}
    td{padding:11px 8px !important; font-size:12.5px !important;}

    /* modal: fill more of the narrow screen */
    #modal{padding:20px !important; max-width:100% !important;}

    /* calendar grid: smaller cells */
    .calday{min-height:60px !important; padding:4px 5px !important;}

    .pagetitle{font-size:20px !important;}

    /* eticheta de conexiune: deasupra barei de jos */
    #connStatus{bottom:calc(72px + env(safe-area-inset-bottom)) !important;}
  }
</style>
</head>
<body>

<div id="connStatus">se conectează…</div>

<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <div style="background:#fff;border:1px solid var(--line-strong);border-radius:16px;padding:32px 30px;width:100%;max-width:340px;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
    <div style="font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--text);margin-bottom:4px;">BEZE CRM</div>
    <div style="font-size:12.5px;color:var(--text3);margin-bottom:22px;">acces restricționat echipei</div>
    <div style="margin-bottom:12px;">
      <div style="font-size:12px;color:var(--text2);margin-bottom:5px;">Email</div>
      <input id="loginEmail" type="email" autocomplete="username" style="width:100%;background:#fff;border:1px solid var(--line-strong);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;outline:none;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:8px;">
      <div style="font-size:12px;color:var(--text2);margin-bottom:5px;">Parolă</div>
      <input id="loginPassword" type="password" autocomplete="current-password" style="width:100%;background:#fff;border:1px solid var(--line-strong);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;outline:none;box-sizing:border-box;">
    </div>
    <div id="loginError" style="display:none;color:#a3372f;font-size:12px;margin-bottom:10px;"></div>
    <button id="loginBtn" class="btn-primary" style="width:100%;margin-top:8px;">Intră</button>
    <button id="forgotBtn" type="button" style="width:100%;margin-top:10px;background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline;">am uitat parola</button>
    <div id="loginInfo" style="display:none;color:var(--accent-dark);font-size:12px;margin-top:10px;line-height:1.45;"></div>
  </div>
</div>

<div id="appShell" class="app-shell" style="display:none;height:100vh;flex-direction:column;overflow:hidden;">

  <div class="topbar-bar" style="background:var(--topbar);padding:16px 26px;display:flex;align-items:center;gap:18px;flex-shrink:0;">
    <div style="font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:#fff;letter-spacing:0.03em;">BEZE</div>
    <input id="topSearch" type="text" placeholder="Caută un client sau un telefon..." style="flex:1;max-width:380px;background:#26292c;border:1px solid #34373a;color:#e8e7e0;padding:10px 14px;border-radius:9px;font-size:13px;outline:none;">
    <div style="margin-left:auto;display:flex;align-items:center;gap:18px;">
      <i class="ti ti-phone header-icon" style="font-size:18px;color:#8f8e85;" aria-hidden="true" title="Apeluri"></i>
      <i class="ti ti-bell header-icon" style="font-size:18px;color:#8f8e85;" aria-hidden="true" title="Notificări"></i>
      <i class="ti ti-settings header-icon" style="font-size:18px;color:#8f8e85;" aria-hidden="true" title="Setări"></i>
      <div class="header-icon" style="width:1px;height:20px;background:#34373a;"></div>
      <div style="display:flex;align-items:center;gap:9px;cursor:pointer;" id="userMenu" title="Deconectează-te">
        <div style="width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:500;flex-shrink:0;">BA</div>
        <span id="userEmailLabel" class="user-email-label" style="font-size:13px;color:#cfcec5;">Beze Acoustics</span>
        <i class="ti ti-logout-2" style="font-size:15px;color:#8f8e85;" aria-hidden="true"></i>
      </div>
    </div>
  </div>

  <div class="app-row" style="display:flex;flex:1;min-height:0;">
    <div class="sidebar" style="width:210px;flex-shrink:0;background:var(--sidebar);padding:20px 14px;display:flex;flex-direction:column;overflow-y:auto;">
      <div id="nav" style="display:flex;flex-direction:column;gap:3px;"></div>
      <div class="sidebar-footnote" style="margin-top:auto;padding:12px;font-size:11.5px;color:#5c5b54;">evidență internă</div>
    </div>
    <div class="content-area" style="flex:1;padding:32px 36px 40px;min-width:0;background:var(--bg);overflow-y:auto;">
      <div id="page"></div>
    </div>
  </div>

</div>

<div id="modalWrap" style="display:none;min-height:400px;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:50;padding:16px;">
  <div id="modal" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.18);"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
